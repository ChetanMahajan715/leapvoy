server {
    listen 80;
    client_max_body_size 20m;  # resume / attachment uploads (base64 JSON)

    location /api/ {
        proxy_pass http://backend:8000/;  # /api/jobs → backend /jobs
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;              # chat answers stream (server-sent events)
        proxy_read_timeout 300s;          # Fetch / Check can take up to ~2 min
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri.html /index.html;  # app routes like /jobs load the app
    }
}

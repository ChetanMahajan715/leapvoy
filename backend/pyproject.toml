[project]
name = "leapvoy-backend"
version = "0.1.0"
description = "Leapvoy backend: Telegram job posts to HR emails"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "dateparser>=1.4.3",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "imap-tools>=1.15.0",
    "instructor>=1.17.0",
    "jinja2>=3.1.6",
    "langgraph>=1.2.12",
    "litellm>=1.103.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymupdf>=1.28.2",
    "pyotp>=2.10.0",
    "rapidocr-onnxruntime>=1.4.4",
    "segno>=1.6.6",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.1",
    "structlog>=26.1.0",
    "telethon>=1.45.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "oci>=2.187.1",
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
